name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build .

  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    needs: [container]
    if: always() && github.event_name == 'push'

    steps:
      - name: Post build result
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK not set, skipping"
            exit 0
          fi
          if [ "$CONTAINER_RESULT" = "success" ]; then
            TITLE="✅ analyzer build passed"
            COLOR=3066993
          else
            TITLE="❌ analyzer build failed"
            COLOR=15158332
          fi
          jq -n \
            --arg title "$TITLE" \
            --arg desc "$REPO @ ${SHA:0:7}" \
            --arg url "$RUN_URL" \
            --argjson color "$COLOR" \
            '{embeds:[{title:$title,description:$desc,url:$url,color:$color}]}' \
            | curl -sS -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK" >/dev/null
